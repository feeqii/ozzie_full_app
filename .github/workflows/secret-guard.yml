name: Secret Guard

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

jobs:
  secret-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scanner executable
        run: chmod +x scripts/secret_guard.sh

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: scripts/secret_guard.sh --range origin/${{ github.base_ref }}...${{ github.sha }}

      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: scripts/secret_guard.sh --range ${{ github.event.before }}..${{ github.sha }}

      - name: Scan entire history (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: scripts/secret_guard.sh --range --all
